# Jig: weekly OpenWiki refresh (installed by jig-init --openwiki github).
# Adapted from langchain-ai/openwiki examples/openwiki-update.yml.
# Secrets: ANTHROPIC_API_KEY, OPENWIKI_PR_TOKEN (fine-grained, this repo only,
# Contents + Pull requests: read and write). Humans review every PR.
name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC; runs with no code change skip model calls

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # --update diffs against the last documented commit

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.5.2

      - name: Run OpenWiki
        id: openwiki
        continue-on-error: true
        run: openwiki code --update --print
        env:
          OPENWIKI_TELEMETRY_DISABLED: "1"
          OPENWIKI_PROVIDER: anthropic
          OPENWIKI_MODEL_ID: claude-sonnet-5
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Remove transient run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Open pull request
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.OPENWIKI_PR_TOKEN }}
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki update. Review it like any other docs change:
            this becomes shared knowledge for people and for Claude.

            OpenWiki result: ${{ steps.openwiki.outcome }}

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
