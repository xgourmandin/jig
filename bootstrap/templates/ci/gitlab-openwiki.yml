# Jig: OpenWiki refresh (installed by jig-init --openwiki gitlab).
# Include from .gitlab-ci.yml:   include: - local: ci/openwiki.gitlab-ci.yml
# Then add a pipeline schedule (e.g. weekly) with OPENWIKI_RUN=1.
# CI/CD variables (masked, protected): ANTHROPIC_API_KEY, OPENWIKI_PUSH_TOKEN
# (project access token, role Developer, scope write_repository).
# Humans review every MR.
openwiki:update:
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OPENWIKI_RUN == "1"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $OPENWIKI_RUN == "1"'
  variables:
    GIT_DEPTH: 0 # --update diffs against the last documented commit
    OPENWIKI_TELEMETRY_DISABLED: "1"
    OPENWIKI_PROVIDER: anthropic
    OPENWIKI_MODEL_ID: claude-sonnet-5
  script:
    - npm install --global openwiki@0.5.2
    - openwiki code --update --print
    - rm -f -- openwiki/.run.json
    - git add -A -- openwiki AGENTS.md CLAUDE.md
    - |
      if git diff --cached --quiet; then echo "No wiki changes."; exit 0; fi
      git -c user.name="OpenWiki bot" -c user.email="openwiki-bot@noreply" commit -m "docs: update OpenWiki"
      git push --force "https://oauth2:${OPENWIKI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        HEAD:refs/heads/openwiki/update \
        -o merge_request.create -o merge_request.target="$CI_DEFAULT_BRANCH" \
        -o merge_request.title="docs: update OpenWiki" -o merge_request.remove_source_branch
