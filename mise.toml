# Tools needed to develop and test the harness itself.
# TODO(bootstrap): pin exact versions once validated.
[tools]
jq = "latest"
shellcheck = "latest"
bats = "latest"
terraform = "latest"
terraform-ls = "latest"
tflint = "latest"

[tasks.test]
run = "bats tests/"

[tasks.lint]
run = [
  "shellcheck -x -P plugins/acme-core/hooks/scripts plugins/*/hooks/scripts/*.sh bootstrap/*.sh",
  "claude plugin validate plugins/acme-core",
  "claude plugin validate plugins/acme-terraform",
]
